name: Background Sync Cron

on:
  schedule:
    # Runs every hour
    - cron: '0 * * * *'
  # Allows you to run this workflow manually from the Actions tab
  workflow_dispatch:

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Hit Vercel Sync Endpoint
        run: |
          curl -X GET "${{ secrets.PROD_URL }}/api/cron/sync" \
          -H "Authorization: Bearer ${{ secrets.CRON_SECRET }}"
